<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Paath Live · Sources</title><style>body{font:17px/1.6 system-ui;background:#f5f3ed;color:#183d32;max-width:1100px;margin:40px auto;padding:24px}h1{font:52px Georgia}article{background:white;padding:24px;border-radius:14px;margin:20px 0}button,a{margin:8px;color:#18563d}button{padding:12px;border:1px solid #b2c4b5;background:#edf4ec;border-radius:8px;cursor:pointer}pre{white-space:pre-wrap;font:inherit;max-height:450px;overflow:auto}.badge{color:#8b4c00}#message{min-height:30px}</style><nav><a href="http://127.0.0.1:8765/">← Lecture Studio</a> / Paath Live</nav><h1>Your material. Ready to review.</h1><p>Import a completed recording from Lecture Studio as a source for Paath Live.</p><p>The interactive teaching controller is not built yet. Imported AI notes require review before teaching.</p><p id="message" role="status"></p><h2>Available recordings</h2><div id="recordings"></div><h2>Imported lesson sources</h2><div id="sources"></div><script>
const el=id=>document.getElementById(id),node=(tag,text)=>{let n=document.createElement(tag);n.textContent=text;return n};
async function load(){try{const r=await fetch('/api/recordings'),data=await r.json();el('recordings').replaceChildren();if(!r.ok)throw Error(data.error);if(!data.length)el('recordings').textContent='Complete a lecture in Lecture Studio first.';for(const j of data){const card=node('article','');card.append(node('h3',j.name));card.append(node('small','Job '+j.id.slice(0,8)));for(const lang of j.languages){const b=node('button','Import '+lang);b.onclick=async()=>{b.disabled=true;try{const r=await fetch('/api/import/'+j.id+'/'+lang,{method:'POST'});const v=await r.json();if(!r.ok)throw Error(v.error);el('message').textContent='Imported. Review the notes against the transcript.';await sources()}catch(e){el('message').textContent=e.message}finally{b.disabled=false}};card.append(b)}el('recordings').append(card)}}catch(e){el('message').textContent=e.message}await sources()}
async function sources(){const r=await fetch('/api/sources');const data=await r.json();el('sources').replaceChildren();for(const s of data){const card=node('article','');card.append(node('h3',s.title+' · '+s.language));card.append(node('p','Needs review · imported from Lecture Studio'));const d=node('details','');d.append(node('summary','Read notes'),node('pre',s.notes));card.append(d);const t=node('details','');t.append(node('summary','Compare source transcript'),node('pre',s.transcript.map(x=>Math.floor(x.start_seconds/60)+':'+String(Math.floor(x.start_seconds%60)).padStart(2,'0')+' '+x.text).join('\n\n')));card.append(t);el('sources').append(card)}}load();
</script></html>
